<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liste des Livres via API DRF</title>
    <!-- Utilisation de Tailwind CSS pour un style minimal et moderne -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .container { max-width: 800px; margin: 50px auto; padding: 20px; }
        body { font-family: 'Inter', sans-serif; background-color: #f7fafc; }
    </style>
</head>
<body>

<div class="container bg-white shadow-xl rounded-lg">
    <h1 class="text-3xl font-bold text-gray-800 mb-6 border-b pb-2">Catalogue de Livres (via API)</h1>

    <div id="loading" class="text-center py-4 text-blue-500">
        Chargement des données...
    </div>

    <table id="booksTable" class="min-w-full divide-y divide-gray-200 hidden">
        <thead class="bg-gray-50">
            <tr>
                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">ID</th>
                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Titre</th>
                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Auteur ID</th>
            </tr>
        </thead>
        <tbody id="booksBody" class="bg-white divide-y divide-gray-200">
            <!-- Les lignes de livres seront insérées ici par JavaScript -->
        </tbody>
    </table>

    <div id="error" class="text-center py-4 text-red-500 hidden">
        Erreur lors du chargement des données. Veuillez vérifier la console.
    </div>
</div>

<script>
    // URL de l'endpoint de votre ViewSet (à ajuster si nécessaire)
    const API_URL = 'http://127.0.0.1:8000/api/books/'; 
    
    // Éléments du DOM
    const loadingElement = document.getElementById('loading');
    const booksTable = document.getElementById('booksTable');
    const booksBody = document.getElementById('booksBody');
    const errorElement = document.getElementById('error');

    /**
     * Récupère les données de l'API et met à jour l'interface utilisateur.
     */
    async function fetchBooks() {
        try {
            // 1. Appel asynchrone à l'API (DRF ViewSet)
            const response = await fetch(API_URL);

            // Vérification des erreurs HTTP (par exemple 404, 500)
            if (!response.ok) {
                throw new Error(`HTTP error! status: ${response.status}`);
            }

            // 2. Conversion de la réponse en objet JSON
            const data = await response.json();
            
            // 3. Traitement et Affichage des données
            renderBooks(data);

        } catch (error) {
            console.error("Fetch error:", error);
            loadingElement.classList.add('hidden');
            errorElement.classList.remove('hidden');
            // Gérer l'échec de la connexion ou de la requête
        }
    }

    /**
     * Construit les lignes du tableau à partir des données JSON.
     * @param {Array} books - Tableau d'objets livre retourné par l'API.
     */
    function renderBooks(books) {
        booksBody.innerHTML = ''; // Nettoyer les données précédentes
        
        if (books.length === 0) {
             booksBody.innerHTML = '<tr><td colspan="3" class="px-6 py-4 text-center text-gray-500">Aucun livre trouvé.</td></tr>';
        } else {
            books.forEach(book => {
                const row = document.createElement('tr');
                
                // Insérer les données JSON dans les cellules du tableau
                row.innerHTML = `
                    <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900">${book.id}</td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">${book.title}</td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">${book.author}</td>
                `;
                booksBody.appendChild(row);
            });
        }
        
        // Cacher le chargement et afficher le tableau
        loadingElement.classList.add('hidden');
        booksTable.classList.remove('hidden');
    }

    // Lancer la fonction au chargement de la page
    document.addEventListener('DOMContentLoaded', fetchBooks);
</script>

</body>
</html>
