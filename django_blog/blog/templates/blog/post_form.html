{% extends "base.html" %}

{% block content %}
    <div class="content-section">
        <form method="POST">
            {% csrf_token %}
            <fieldset class="form-group">
                <legend class="border-bottom mb-4">
                    {% if form.instance.pk %}
                        Modifier le Post
                    {% else %}
                        Créer un Post
                    {% endif %}
                </legend>
                {{ form.as_p }}
            </fieldset>
            <div class="form-group">
                <button class="btn btn-outline-info" type="submit">Sauvegarder</button>
            </div>
        </form>
    </div>
{% endblock content %}
